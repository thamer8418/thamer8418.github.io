  <script>
    /* يضبط الوضع الفاتح/الداكن قبل ظهور الصفحة لتفادي الوميض */
    (function () {
      var d = document.documentElement, t = null, def = null;
      try { t = localStorage.getItem("ta-theme"); def = localStorage.getItem("ta-default-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = def || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      d.setAttribute("data-theme", t);
      d.classList.add("is-loading");
      /* أول زيارة: شاشة الافتتاح. بعدها: ستارة سريعة بين الصفحات */
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var seen = null; try { seen = sessionStorage.getItem("ta-seen"); } catch (e) {}
        d.classList.add(seen ? "via-curtain" : "first-visit");
      }
    })();
  </script>
