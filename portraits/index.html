<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" class="has-hero">
<head>
  <base href="../">
  <title>قسم — ثامر الحربي</title>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121211">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/logo/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/thmanyahserifdisplay-Light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/thmanyahserifdisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/motion.css">
  <script>
    /* يضبط الوضع الفاتح/الداكن قبل ظهور الصفحة لتفادي الوميض */
    (function () {
      var d = document.documentElement, t = null, def = null;
      try { t = localStorage.getItem("ta-theme"); def = localStorage.getItem("ta-default-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = def || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      d.setAttribute("data-theme", t);
      d.classList.add("is-loading");
      /* أول زيارة: شاشة الافتتاح. بعدها: ستارة سريعة بين الصفحات */
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var seen = null; try { seen = sessionStorage.getItem("ta-seen"); } catch (e) {}
        d.classList.add(seen ? "via-curtain" : "first-visit");
      }
    })();
  </script>
</head>
<body class="page-section">
  <!-- شاشة الافتتاح (أول زيارة) وستارة الانتقال بين الصفحات -->
  <div class="loader" aria-hidden="true">
    <div class="loader-inner">
      <span class="logo-mark"></span>
      <div class="loader-line"><span>ثامر الحربي</span><span class="loader-bar"><i></i></span><span class="loader-count">٠</span></div>
    </div>
  </div>
  <div class="curtain" aria-hidden="true"><span class="logo-mark"></span></div>
  <header class="site-header">
    <nav class="nav" aria-label="القائمة الرئيسية">
      <a href="index.html">الأعمال</a>
      <a href="contact.html">للحجز</a>
    </nav>
    <a class="brand" href="index.html" aria-label="ثامر الحربي — الرئيسية"><span class="logo-mark"></span></a>
    <div class="header-end">
      <button class="theme-toggle" type="button" data-theme-toggle><span class="dot" aria-hidden="true"></span><span class="label">فاتح</span></button>
    </div>
  </header>

  <!-- صفحة واحدة لكل الأقسام: section.html?id=weddings
       لا تحتوي على روابط للأقسام الأخرى. -->
  <main id="main">
    <section class="hero" data-hero aria-labelledby="section-title">
      <div class="hero-media"><img data-hero-img alt=""></div>
      <div class="hero-shade"></div>
      <div class="hero-index"><span>قسم</span><span data-section-count></span></div>
      <div class="hero-content">
        <h1 class="hero-title" id="section-title" data-section-title></h1>
        <div class="hero-row"><p class="hero-lede" data-section-desc data-reveal style="--rd:500ms"></p></div>
      </div>
      <div class="hero-scroll" aria-hidden="true"><span>مرّر للاستكشاف</span><i></i></div>
    </section>
    <div style="height:clamp(60px,8vw,120px)"></div>
    <section class="gallery" data-gallery aria-label="صور القسم"></section>
  </main>

  <section class="footer-cta">
    <p data-reveal>لديك مناسبة قادمة؟</p>
    <a class="big" href="contact.html" data-cursor="تواصل"><span data-split>لنحكِ قصّتك</span> <span class="arr" aria-hidden="true">↖</span></a>
  </section>
  <footer class="site-footer">
    <span>© <span data-year>٢٠٢٦</span> ثامر الحربي</span>
    <span class="tagline" data-text="footerTagline">يوم الفرح يستاهل توثيقه بكل احترافية</span>
    <nav class="end" aria-label="روابط التذييل">
      <a href="index.html">الأعمال</a>
      <a href="contact.html">للحجز</a>
    </nav>
  </footer>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/lightbox.js"></script>
  <script src="assets/js/gallery.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
